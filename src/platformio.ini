[platformio]

[env]
build_src_filter = +<*.c>
monitor_speed = 9600
build_flags =
	-D DEBUG=0
	-D OUTPUT_POWER_TESTING=0
	-D OFFSET=0.0 # dBm cal correction.  -ve and +ve offsets allowed.
	-D LED_INDICATION_OF_VTX_MODE=1
	# --- RF Power Closed-Loop PID Parameters (see src/powerControl.h) ---
	-D POWER_CONTROL_MODE=1          # 1 = Type-C I-PD PID, 0 = Legacy +-1 step
	-D POWER_PID_KP=0.05f            # Proportional damping gain on VPD (keep < 0.12f)
	-D POWER_PID_KI=0.02f            # Integral gain on VPD error
	-D POWER_PID_KD=0.00f            # Derivative gain on filtered VPD
	-D POWER_PID_EMA_ALPHA=0.25f     # VPD low-pass filter alpha (0.01..1.0)
	-D POWER_PID_DEADBAND_MV=3.0f    # Steady-state error deadband (mV)
	-D POWER_PID_MAX_STEP_DOWN=10.0f # Max PWM decrease / 5ms (power ramp-UP limit)
	-D POWER_PID_MAX_STEP_UP=15.0f   # Max PWM increase / 5ms (power ramp-DOWN limit)
	-D POWER_PID_HYSTERESIS=0.75f    # Output quantization hysteresis (PWM counts)
	#-D POWER_PID_TUNING=1           # Uncomment or use *_tune env for live UART CLI @ 57600 8N1

# -----------------------------

[env_stm8]
platform = ststm8
board = stm8sblue
framework = arduino
upload_protocol = stlinkv2
build_src_filter =
	${env.build_src_filter}
	+<stm8/*.c>
build_flags =
	${env.build_flags}
	-I src/stm8

# ----------

[IGNORE env:EACHINE_TX801]
extends = env_stm8
build_src_filter =
	${env_stm8.build_src_filter}
	+<targets/Eachine_TX801/*.c>
build_flags =
	${env_stm8.build_flags}
	-D EACHINE_TX801=1

[IGNORE env:EACHINE_TX526]
extends = env_stm8
build_src_filter =
	${env_stm8.build_src_filter}
	+<targets/Eachine_TX526/*.c>
build_flags =
	${env_stm8.build_flags}
	-D EACHINE_TX526=1

# -----------------------------

[env_gd32f130]
platform = ststm32@15.4.1
platform_packages =
    maxgerhardt/framework-spl@2.10300.0
    platformio/tool-dfuutil@1.11.0
    platformio/tool-openocd@2.1100.211028
    platformio/tool-stm32duino@1.0.1
    platformio/toolchain-gccarmnoneeabi@1.70201.0
framework = spl
board = gd32f130g6
build_src_filter =
	${env.build_src_filter}
	+<gd32f1x0/*.c>
build_flags =
	-Wall
	-Werror
	-Wextra
	${env.build_flags}
	-I src/gd32f1x0
	--specs=nano.specs
	-Wl,-Map,firmware.map
	#-D HXTAL_VALUE=8000000
	#-D __SYSTEM_CLOCK_72M_PLL_HXTAL=72000000U

# ----------

[env:Generic_GD32F130_develop]
extends = env_gd32f130
build_src_filter =
	${env_gd32f130.build_src_filter}
	+<targets/Generic_GD32F130/*.c>
build_flags =
	${env_gd32f130.build_flags}
	-D GENERIC_GD32F130=1

[env:Generic_GD32F130]
extends = env:Generic_GD32F130_develop
build_flags =
	${env:Generic_GD32F130_develop.build_flags}
	-Wl,--defsym=FLASH_APP_OFFSET=8K
upload_protocol = custom
upload_command =
	python scripts/uart_upload.py "$SOURCE"

# ----------

[env:EWRF_E7082VM]
extends = env:Generic_GD32F130

