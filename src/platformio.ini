# -----------------------------
# ST-Link one-shot flashing (Bootloader + App combined)
# Builds firmware_combined.bin (0x08000000 bootloader + 0x08002000 app)
# and flashes it via ST-Link while preserving UART passthrough updates.

[env_gd32f130_stlink]
extra_scripts = post:scripts/merge_bootloader.py
custom_bootloader = bootloader/Generic_GD32F130_bootloader.bin
custom_bootloader_offset = 0x2000
custom_stlink_flash = true
custom_stlink_unlock = false
upload_protocol = custom
upload_command =

[env_gd32f130_stlink_unlock]
extends = env_gd32f130_stlink
custom_stlink_unlock = true

[env:DIY_VTX820_stlink]
extends = env:DIY_VTX820, env_gd32f130_stlink

[env:DIY_VTX820_stlink_unlock]
extends = env:DIY_VTX820, env_gd32f130_stlink_unlock

[env:Generic_GD32F130_stlink]
extends = env:Generic_GD32F130, env_gd32f130_stlink

[env:Generic_GD32F130_stlink_unlock]
extends = env:Generic_GD32F130, env_gd32f130_stlink_unlock

# -----------------------------
# Live UART PID Tuning Environments (57600 8N1 on PA9, use with python/pid_tuner.py)

[env:DIY_VTX820_tune]
extends = env:DIY_VTX820
build_flags =
	${env:DIY_VTX820.build_flags}
	-UPOWER_PID_TUNING
	-DPOWER_PID_TUNING=1

[env:DIY_VTX820_tune_stlink]
extends = env:DIY_VTX820_tune, env_gd32f130_stlink

[env:Generic_GD32F130_tune]
extends = env:Generic_GD32F130
build_flags =
	${env:Generic_GD32F130.build_flags}
	-UPOWER_PID_TUNING
	-DPOWER_PID_TUNING=1

[env:Generic_GD32F130_tune_stlink]
extends = env:Generic_GD32F130_tune, env_gd32f130_stlink

