[env:DIY_VTX820_develop]
extends = env_gd32f130
build_src_filter = 
	${env_gd32f130.build_src_filter}
	+<targets/DIY_VTX820/*.c>
build_flags =
	${env_gd32f130.build_flags}
	-D DIY_VTX820=1

[env:DIY_VTX820]
extends = env:DIY_VTX820_develop
build_flags = 
	${env:DIY_VTX820_develop.build_flags}
	-Wl,--defsym=FLASH_APP_OFFSET=8K
upload_protocol = custom
upload_command =
